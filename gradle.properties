org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official

# The iOS targets, and the StoreKit cinterop, can only be built on macOS; CI builds them there
kotlin.native.ignoreDisabledTargets=true
# The StoreKit cinterop can't be cross-compiled, and the other modules' iOS klibs aren't needed off macOS
kotlin.native.enableKlibsCrossCompilation=false
# Link with one backend thread per processor rather than 4, which warns on machines with fewer processors
kotlin.native.parallelThreads=0

# Lets iosMain, which is shared by the iOS targets, see the StoreKit bridge cinterop
kotlin.mpp.enableCInteropCommonization=true

# Maven Publishing
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true

GROUP=com.appmattus.billing

POM_DESCRIPTION=A Kotlin Multiplatform wrapper for Google Play, Amazon Appstore, StoreKit and Windows Store in-app purchases
