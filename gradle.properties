org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official

# Lets iosMain, which is shared by the iOS targets, see the StoreKit bridge cinterop
kotlin.mpp.enableCInteropCommonization=true

# Maven Publishing
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true

GROUP=com.appmattus.billing

POM_DESCRIPTION=A Kotlin Multiplatform wrapper for Google Play, Amazon Appstore, StoreKit and Windows Store in-app purchases
POM_INCEPTION_YEAR=2026

POM_URL=https://github.com/appmattus/kmp-billing
POM_SCM_URL=https://github.com/appmattus/kmp-billing/tree/main
POM_SCM_CONNECTION=scm:git:git://github.com/appmattus/kmp-billing.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/appmattus/kmp-billing.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt

POM_DEVELOPER_ID=appmattus
POM_DEVELOPER_NAME=Appmattus Limited
POM_DEVELOPER_URL=https://github.com/appmattus/
